[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "moveproof"
version = "0.1.1"
description = "Fast, versioned file fingerprints and rename detection for local indexes"
readme = "README.en.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "snchngny" }]
keywords = [
  "filesystem",
  "fingerprint",
  "rename-detection",
  "move-detection",
  "media-library",
  "immich",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Filesystems",
]

[project.scripts]
moveproof = "moveproof.cli:main"

[project.urls]
Repository = "https://github.com/snchngny/moveproof"
Issues = "https://github.com/snchngny/moveproof/issues"
Funding = "https://github.com/sponsors/snchngny"

[tool.hatch.build.targets.wheel]
packages = ["src/moveproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
